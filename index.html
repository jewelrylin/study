["health","安全觀念","運動前進行暖身的主要目的為何？",["讓身體準備活動並降低受傷機會","讓自己立刻疲累","取代喝水","讓比賽停止"],0,"暖身能提升身體準備程度。"],

].map(([s,u,q,o,a,e])=>({s,u,q,o,a,e}));
let subject="",questions=[],answers=[],current=0,started=0;
const $=id=>document.getElementById(id),letters=["A","B","C","D"],shuffle=a=>[...a].sort(()=>Math.random()-.5);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");window.scrollTo({top:0,behavior:"smooth"})}
function renderSubjects(){$("subjects").innerHTML=Object.entries(subjects).map(([k,s])=>`<button class="subject" data-subject="${k}" style="--tone:${s.tone}"><span class="subject-icon">${s.icon}</span><h3>${s.name}</h3><p>${s.desc}</p><span class="publisher">${s.publisher}版</span></button>`).join("");document.querySelectorAll("[data-subject]").forEach(b=>b.onclick=()=>chooseSubject(b.dataset.subject))}
function chooseSubject(key){subject=key;const s=subjects[key];$("choosePublisher").textContent=`${s.publisher}版 · 四年級下學期`;$("chooseTitle").textContent=`${s.name}練習`;$("chooseDesc").textContent=s.desc;const units=[...new Set(Q.filter(x=>x.s===key).map(x=>x.u))];$("units").innerHTML=`<button class="unit all" data-unit="all"><strong>綜合練習</strong><small>從所有單元隨機出題</small></button>`+units.map(u=>`<button class="unit" data-unit="${u}"><strong>${u}</strong><small>針對這個單元加強練習</small></button>`).join("");document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>start(b.dataset.unit));show("choose")}
function start(unit,custom=null){questions=custom||shuffle(Q.filter(x=>x.s===subject&&(unit==="all"||x.u===unit))).slice(0,unit==="all"?8:6);answers=Array(questions.length).fill(null);current=0;started=Date.now();$("examPublisher").textContent=`${subjects[subject].publisher}版 · ${subjects[subject].name}`;$("examMode").textContent=custom?"錯題再練":unit==="all"?"綜合練習":unit;$("warning").hidden=true;show("exam");renderQuestion()}
function renderNav(){const done=answers.filter(x=>x!==null).length;$("progressText").textContent=`${done} / ${questions.length}`;$("progressFill").style.width=`${done/questions.length*100}%`;$("nav").innerHTML=questions.map((_,i)=>`<button class="dot ${answers[i]!==null?"answered":""} ${i===current?"current":""}" data-i="${i}">${i+1}</button>`).join("");document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{current=+b.dataset.i;renderQuestion()})}
function renderQuestion(){const x=questions[current];$("question").innerHTML=`<div class="qmeta"><span class="badge">${x.u}</span><span>第 ${current+1} 題，共 ${questions.length} 題</span></div><h2>${x.q}</h2><div class="options">${x.o.map((o,i)=>`<button class="option ${answers[current]===i?"selected":""}" data-choice="${i}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join("")}</div><div class="actions"><button id="prev" class="secondary" ${current===0?"disabled":""}>← 上一題</button><button id="next" class="primary">${current===questions.length-1?"完成作答":"下一題 →"}</button></div>`;document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{answers[current]=+b.dataset.choice;renderQuestion()});$("prev").onclick=()=>{if(current){current--;renderQuestion()}};$("next").onclick=()=>{if(current<questions.length-1){current++;renderQuestion()}else submit()};renderNav()}
function submit(){const missing=answers.filter(x=>x===null).length;if(missing){$("warning").textContent=`還有 ${missing} 題未作答。`;$("warning").hidden=false;return}const correct=questions.filter((q,i)=>q.a===answers[i]).length,score=Math.round(correct/questions.length*100),secs=Math.max(1,Math.round((Date.now()-started)/1000));$("score").textContent=score;$("ring").style.setProperty("--score",`${score}%`);$("resultTitle").textContent=score>=90?"掌握得很穩！":score>=70?"訂正後會更好！":"先看解析，再練一次！";$("resultText").textContent=`答對 ${correct} 題，共 ${questions.length} 題。`;$("stats").innerHTML=`<div class="stat paper"><small>科目</small><strong>${subjects[subject].name}</strong></div><div class="stat paper"><small>答對題數</small><strong>${correct} / ${questions.length}</strong></div><div class="stat paper"><small>完成時間</small><strong>${Math.floor(secs/60)}分${secs%60}秒</strong></div>`;$("reviews").innerHTML=questions.map((q,i)=>{const ok=q.a===answers[i];return`<article class="review paper ${ok?"correct":""}"><h3>${ok?"答對":"需要訂正"}｜${q.q}</h3><p><strong>你的答案：</strong>${letters[answers[i]]} ${q.o[answers[i]]}</p>${ok?"":`<p><strong>正確答案：</strong>${letters[q.a]} ${q.o[q.a]}</p>`}<p class="explain">${q.e}</p></article>`}).join("");$("retry").hidden=correct===questions.length;show("result")}
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>show("home"));document.querySelectorAll("[data-choose]").forEach(b=>b.onclick=()=>chooseSubject(subject));$("submit").onclick=submit;$("retry").onclick=()=>start("",questions.filter((q,i)=>q.a!==answers[i]));renderSubjects();
</script>
