const isCorrect=(q,a,i)=>q.type==="fill"?fillIssues(q,a,i).length===0:q.a===a;

function renderSubjects(){$("subjects").innerHTML=Object.entries(subjects).map(([k,s])=>`<button class="subject" data-subject="${k}" style="--tone:${s.tone}"><span class="subject-icon">${s.icon}</span><h3>${s.name}</h3><p>${s.desc}</p><span class="publisher">${s.publisher}版</span></button>`).join("");document.querySelectorAll("[data-subject]").forEach(b=>b.onclick=()=>chooseSubject(b.dataset.subject))}
function chooseSubject(key){subject=key;const s=subjects[key];$("choosePublisher").textContent=`${s.publisher}版 · 四年級下學期`;$("chooseTitle").textContent=`${s.name}練習`;$("chooseDesc").textContent=s.desc;const units=[...new Set(Q.filter(x=>x.s===key).map(x=>x.u))];$("units").innerHTML=`<button class="unit all" data-unit="all"><strong>完整考卷 · 25 題</strong><small>比照正規考卷份量，從所有單元隨機出題</small></button>`+units.map(u=>`<button class="unit" data-unit="${u}"><strong>${u}</strong><small>使用這個單元的全部題目</small></button>`).join("");document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>start(b.dataset.unit));show("choose")}
function start(unit,custom=null){const pool=shuffle(Q.filter(x=>x.s===subject&&(unit==="all"||x.u===unit)));questions=custom||(subject==="chinese"&&unit==="all"?shuffle([...shuffle(pool.filter(x=>x.type==="fill")).slice(0,5),...shuffle(pool.filter(x=>x.type!=="fill")).slice(0,20)]):pool.slice(0,unit==="all"?25:pool.length));answers=questions.map(q=>q.type==="fill"?["",""]:null);current=0;started=Date.now();$("examPublisher").textContent=`${subjects[subject].publisher}版 · ${subjects[subject].name}`;$("examMode").textContent=custom?"錯題再練":unit==="all"?"完整考卷 · 25 題":unit;$("warning").hidden=true;show("exam");renderQuestion()}
function renderNav(){const done=answers.filter((a,i)=>isAnswered(questions[i],a)).length;$("progressText").textContent=`${done} / ${questions.length}`;$("progressFill").style.width=`${done/questions.length*100}%`;$("nav").innerHTML=questions.map((q,i)=>`<button class="dot ${isAnswered(q,answers[i])?"answered":""} ${i===current?"current":""}" data-i="${i}">${i+1}</button>`).join("");document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{current=+b.dataset.i;renderQuestion()})}
function renderQuestion(){const x=questions[current],answerArea=x.type==="fill"?`<div class="sentence-box"><div class="sentence-builder"><span>${x.parts[0]}</span><input class="sentence-blank" data-blank="0" value="${escapeHtml(answers[current][0])}" maxlength="50"><span>${x.parts[1]}</span><input class="sentence-blank" data-blank="1" value="${escapeHtml(answers[current][1])}" maxlength="50"><span>${x.parts[2]}</span></div></div>`:`<div class="options">${x.o.map((o,i)=>`<button class="option ${answers[current]===i?"selected":""}" data-choice="${i}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join("")}</div>`;$("question").innerHTML=`<div class="qmeta"><span class="badge">${x.u}</span><span>第 ${current+1} 題，共 ${questions.length} 題</span></div><h2>${x.q}</h2>${answerArea}<div class="actions"><button id="prev" class="secondary" ${current===0?"disabled":""}>← 上一題</button><button id="next" class="primary">${current===questions.length-1?"完成作答":"下一題 →"}</button></div>`;document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{answers[current]=+b.dataset.choice;renderQuestion()});document.querySelectorAll("[data-blank]").forEach(input=>input.oninput=()=>{answers[current][+input.dataset.blank]=input.value;renderNav()});$("prev").onclick=()=>{if(current){current--;renderQuestion()}};$("next").onclick=()=>{if(current<questions.length-1){current++;renderQuestion()}else submit()};renderNav()}
function submit(){const missing=answers.filter((a,i)=>!isAnswered(questions[i],a)).length;if(missing){$("warning").textContent=`還有 ${missing} 題未作答。`;$("warning").hidden=false;return}const correct=questions.filter((q,i)=>isCorrect(q,answers[i],i)).length,score=Math.round(correct/questions.length*100),secs=Math.max(1,Math.round((Date.now()-started)/1000));$("score").textContent=score;$("ring").style.setProperty("--score",`${score}%`);$("resultTitle").textContent=score>=90?"掌握得很穩！":score>=70?"訂正後會更好！":"先看解析，再練一次！";$("resultText").textContent=`答對 ${correct} 題，共 ${questions.length} 題。`;$("stats").innerHTML=`<div class="stat paper"><small>科目</small><strong>${subjects[subject].name}</strong></div><div class="stat paper"><small>答對題數</small><strong>${correct} / ${questions.length}</strong></div><div class="stat paper"><small>完成時間</small><strong>${Math.floor(secs/60)}分${secs%60}秒</strong></div>`;$("reviews").innerHTML=questions.map((q,i)=>{const ok=isCorrect(q,answers[i],i),issues=q.type==="fill"?fillIssues(q,answers[i],i):[],student=q.type==="fill"?escapeHtml(sentence(q,answers[i])):`${letters[answers[i]]} ${q.o[answers[i]]}`;return`<article class="review paper ${ok?"correct":""}"><h3>${ok?"答對":"需要訂正"}｜${q.q}</h3><p><strong>你的答案：</strong>${student}</p>${q.type==="fill"?`<p><strong>審視結果：</strong>${ok?"句型完整，內容具體且沒有明顯重複。":issues.map(escapeHtml).join(" ")}</p>`:(ok?"":`<p><strong>正確答案：</strong>${letters[q.a]} ${q.o[q.a]}</p>`)}<p class="explain">${q.e}</p></article>`}).join("");$("retry").hidden=correct===questions.length;show("result")}
